<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkHero — Page Proposals</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #171a23;
      --text: #e7e9ee;
      --muted: #9aa1ad;
      --accent: #4f8cff;
      --border: #262b36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 64px 24px; }
    header { margin-bottom: 48px; }
    h1 { font-size: 2.2rem; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 1.05rem; }
    .grid { display: grid; gap: 16px; }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s ease, transform .15s ease;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .card p { margin: 0; color: var(--muted); font-size: .95rem; }
    footer { margin-top: 56px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>WorkHero — Page Proposals</h1>
      <p class="sub">Proposed page designs and layouts. Click any proposal to view it.</p>
    </header>

    <div class="grid">
      <a class="card" href="proposals/home/">
        <h2>Home Page</h2>
        <p>Proposed redesign of the landing page.</p>
      </a>
      <!-- Add more proposal cards here as you build them -->
    </div>

    <footer>
      Draft proposals · not affiliated with the live useworkhero.com site
    </footer>
  </div>
</body>
</html>
